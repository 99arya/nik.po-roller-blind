<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" width="1200" height="1100" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <style>
    .box   { fill:#fff; stroke:#2f3640; stroke-width:2; rx:8; }
    .btitle{ font-size:16px; font-weight:700; fill:#1b1f26; text-anchor:middle; }
    .bsub  { font-size:11px; fill:#7a8290; text-anchor:middle; }
    .pin   { font-size:12px; font-weight:600; fill:#2f3640; }
    .pinR  { font-size:12px; font-weight:600; fill:#2f3640; text-anchor:end; }
    .wlbl  { font-size:11px; font-weight:700; }
    .w12   { stroke:#d63c30; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .w33   { stroke:#e08a1e; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .wgnd  { stroke:#2f3640; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .wsig  { stroke:#1f6fd0; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .wmot  { stroke:#12946b; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .wled  { stroke:#9b30d6; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  </style>

  <rect x="0" y="0" width="1200" height="1100" fill="#ffffff"/>

  <text x="40" y="42" font-size="24" font-weight="700" fill="#1b1f26">Roller Blind — Wiring Diagram</text>
  <text x="40" y="64" font-size="13" fill="#7a8290">ESP32-C3 SuperMini · TB6612FNG · JGY-370 12V · MP1584E · RGB LED · 3 buttons</text>

  <!-- ══ DC JACK ══ -->
  <rect class="box" x="40" y="90" width="170" height="70"/>
  <text class="btitle" x="125" y="120">DC JACK</text>
  <text class="bsub"   x="125" y="138">5.5 × 2.1 mm · 12 V</text>
  <text class="pin" x="60"  y="155">+12V</text>
  <text class="pin" x="140" y="155">GND</text>

  <!-- ══ MINI-360 ══ -->
  <rect class="box" x="40" y="250" width="170" height="110"/>
  <text class="btitle" x="125" y="292">MP1584E</text>
  <text class="bsub"   x="125" y="310">buck converter</text>
  <text class="bsub"   x="125" y="326" font-weight="700" fill="#d63c30">SET TO 3.3 V FIRST</text>
  <text class="pin" x="66"  y="268">IN+</text>
  <text class="pin" x="142" y="268">IN−</text>
  <text class="pin" x="62"  y="352">OUT+</text>
  <text class="pin" x="138" y="352">OUT−</text>

  <!-- ══ RGB LED ══ -->
  <rect class="box" x="60" y="500" width="150" height="110"/>
  <text class="btitle" x="135" y="528">RGB LED</text>
  <text class="bsub"   x="135" y="546">common cathode</text>
  <text class="pinR" x="200" y="570">Red</text>
  <text class="pinR" x="200" y="590">Green</text>
  <text class="pinR" x="200" y="610">Blue</text>
  <text class="pin"  x="70"  y="590">K (GND)</text>

  <!-- ══ ESP32-C3 ══ -->
  <rect class="box" x="340" y="430" width="260" height="490"/>
  <text class="btitle" x="470" y="462">ESP32-C3 SuperMini</text>
  <text class="bsub"   x="470" y="480">pin order matches the</text>
  <text class="bsub"   x="470" y="494">board silkscreen</text>
  <!-- Left column (accent pins for LED + stop) -->
  <text class="pin"  x="350" y="520">GND</text>
  <text class="pin"  x="350" y="548">3V3</text>
  <text class="pin"  x="350" y="580">GPIO0</text>
  <text class="pin"  x="350" y="612">GPIO1</text>
  <text class="pin"  x="350" y="644">GPIO2</text>
  <text class="pin"  x="350" y="676">GPIO3</text>
  <!-- Right column (motor driver + buttons) -->
  <text class="pinR" x="590" y="580">GPIO5</text>
  <text class="pinR" x="590" y="612">GPIO6</text>
  <text class="pinR" x="590" y="644">GPIO7</text>
  <text class="pinR" x="590" y="676">GPIO10</text>
  <text class="pinR" x="590" y="740">GPIO20</text>
  <text class="pinR" x="590" y="800">GPIO21</text>
  <text class="pinR" x="590" y="860">GPIO3</text>

  <!-- ══ TB6612FNG ══ -->
  <rect class="box" x="800" y="430" width="230" height="390"/>
  <text class="btitle" x="915" y="462">TB6612FNG</text>
  <text class="bsub"   x="915" y="480">motor driver</text>
  <text class="bsub"   x="915" y="494">channel A used, B unused</text>
  <text class="pin"  x="810" y="580">PWMA</text>
  <text class="pin"  x="810" y="612">AIN2</text>
  <text class="pin"  x="810" y="644">AIN1</text>
  <text class="pin"  x="810" y="676">STBY</text>
  <text class="pinR" x="1020" y="580">VM</text>
  <text class="pinR" x="1020" y="612">VCC</text>
  <text class="pinR" x="1020" y="676">AO1</text>
  <text class="pinR" x="1020" y="716">AO2</text>
  <text class="pinR" x="1020" y="790">GND</text>

  <!-- ══ MOTOR ══ -->
  <rect class="box" x="1050" y="660" width="130" height="110"/>
  <text class="btitle" x="1115" y="690">JGY-370</text>
  <text class="bsub"   x="1115" y="706">12 V 40 RPM worm gear</text>
  <text class="bsub"   x="1115" y="726" font-weight="700" fill="#12946b">polarity not critical -</text>
  <text class="bsub"   x="1115" y="740" font-weight="700" fill="#12946b">flip "Reverse Motor"</text>

  <!-- ══ BUTTONS (all on right side of ESP) ══ -->
  <rect class="box" x="640" y="718" width="100" height="45"/>
  <text class="btitle" x="690" y="736" font-size="13">BTN UP</text>
  <text class="bsub"   x="690" y="752">tactile</text>

  <rect class="box" x="640" y="778" width="100" height="45"/>
  <text class="btitle" x="690" y="796" font-size="13">BTN DOWN</text>
  <text class="bsub"   x="690" y="812">tactile</text>

  <rect class="box" x="640" y="838" width="100" height="45"/>
  <text class="btitle" x="690" y="856" font-size="13">BTN STOP</text>
  <text class="bsub"   x="690" y="872">tactile</text>

  <!-- ══ NOTES ══ -->
  <rect x="1045" y="430" width="150" height="225" fill="#fdf7ec" stroke="#e0c89a" stroke-width="1.5" rx="8"/>
  <text x="1060" y="452" font-size="12.5" font-weight="700" fill="#8a6a1e">BEFORE POWER-UP</text>
  <text x="1060" y="474" font-size="10.5" fill="#5a4a2a">1. Set MP1584E to 3.3V</text>
  <text x="1060" y="488" font-size="10.5" fill="#5a4a2a">   first - multimeter,</text>
  <text x="1060" y="502" font-size="10.5" fill="#5a4a2a">   no load. Wrong volt-</text>
  <text x="1060" y="516" font-size="10.5" fill="#5a4a2a">   age kills the ESP.</text>
  <text x="1060" y="538" font-size="10.5" fill="#5a4a2a">2. Flash over USB</text>
  <text x="1060" y="552" font-size="10.5" fill="#5a4a2a">   before soldering in.</text>
  <text x="1060" y="574" font-size="10.5" fill="#5a4a2a">3. Never USB + 12V</text>
  <text x="1060" y="588" font-size="10.5" fill="#5a4a2a">   together - they'd</text>
  <text x="1060" y="602" font-size="10.5" fill="#5a4a2a">   fight on the 3V3 rail.</text>
  <text x="1060" y="624" font-size="10.5" fill="#5a4a2a">4. Buttons: internal</text>
  <text x="1060" y="638" font-size="10.5" fill="#5a4a2a">   pull-ups, no extra</text>
  <text x="1060" y="652" font-size="10.5" fill="#5a4a2a">   resistors needed.</text>

  <!-- ══════ 12 V (red) ══════ -->
  <path class="w12" d="M90 160 L90 250"/>
  <path class="w12" d="M90 200 L1040 200 L1040 580 L1030 580"/>
  <circle cx="90" cy="200" r="5" fill="#d63c30"/>
  <text class="wlbl" x="500" y="192" fill="#d63c30">12 V</text>

  <!-- ══════ 3.3 V (orange) ══════ -->
  <path class="w33" d="M90 360 L90 390 L290 390"/>
  <path class="w33" d="M290 390 L290 548 L340 548"/>
  <path class="w33" d="M290 390 L290 240 L1050 240 L1050 612 L1030 612"/>
  <circle cx="290" cy="390" r="5" fill="#e08a1e"/>
  <text class="wlbl" x="500" y="232" fill="#e08a1e">3.3 V</text>

  <!-- ══════ GND (dark) ══════ -->
  <path class="wgnd" d="M160 160 L160 250"/>
  <path class="wgnd" d="M160 360 L160 1030"/>
  <path class="wgnd" d="M340 520 L270 520 L270 1030"/>
  <!-- LED cathode to GND -->
  <path class="wgnd" d="M70 590 L40 590 L40 1030"/>
  <!-- BTN UP to GND -->
  <path class="wgnd" d="M740 740 L760 740 L760 1030"/>
  <!-- BTN DOWN to GND -->
  <path class="wgnd" d="M740 800 L770 800 L770 1030"/>
  <!-- BTN STOP to GND -->
  <path class="wgnd" d="M740 860 L780 860 L780 1030"/>
  <!-- TB6612 GND -->
  <path class="wgnd" d="M1030 790 L1190 790 L1190 1030"/>
  <!-- Common GND rail -->
  <path class="wgnd" d="M40 1030 L1190 1030"/>
  <circle cx="40" cy="1030" r="5" fill="#2f3640"/>
  <circle cx="160" cy="1030" r="5" fill="#2f3640"/>
  <circle cx="270" cy="1030" r="5" fill="#2f3640"/>
  <circle cx="760" cy="1030" r="5" fill="#2f3640"/>
  <circle cx="770" cy="1030" r="5" fill="#2f3640"/>
  <circle cx="780" cy="1030" r="5" fill="#2f3640"/>
  <circle cx="1190" cy="1030" r="5" fill="#2f3640"/>
  <text class="wlbl" x="900" y="1050" fill="#2f3640">COMMON GND</text>

  <!-- ══════ SIGNALS (blue) — ESP right → TB6612 ══════ -->
  <!-- GPIO5  → PWMA -->
  <path class="wsig" d="M600 580 L800 580"/>
  <!-- GPIO6  → AIN2 -->
  <path class="wsig" d="M600 612 L800 612"/>
  <!-- GPIO7  → AIN1 -->
  <path class="wsig" d="M600 644 L800 644"/>
  <!-- GPIO10 → STBY -->
  <path class="wsig" d="M600 676 L800 676"/>
  <!-- GPIO20 → BTN UP -->
  <path class="wsig" d="M600 740 L640 740"/>
  <!-- GPIO21 → BTN DOWN -->
  <path class="wsig" d="M600 800 L640 800"/>
  <!-- GPIO3 → BTN STOP (from left side of ESP, route under to right) -->
  <path class="wsig" d="M340 676 L320 676 L320 860 L640 860"/>

  <!-- ══════ LED signals (purple) — ESP left → RGB LED ══════ -->
  <!-- GPIO0 → Red -->
  <path class="wled" d="M340 580 L210 570"/>
  <!-- GPIO1 → Green -->
  <path class="wled" d="M340 612 L260 612 L260 590 L210 590"/>
  <!-- GPIO2 → Blue -->
  <path class="wled" d="M340 644 L250 644 L250 610 L210 610"/>

  <!-- ══════ MOTOR (green) ══════ -->
  <path class="wmot" d="M1030 676 L1050 676"/>
  <path class="wmot" d="M1030 716 L1050 716"/>

  <!-- ══ LEGEND ══ -->
  <line x1="40"  y1="1070" x2="80"  y2="1070" class="w12"/>
  <text x="88"  y="1074" font-size="12" fill="#3d4450">12 V</text>
  <line x1="150" y1="1070" x2="190" y2="1070" class="w33"/>
  <text x="198" y="1074" font-size="12" fill="#3d4450">3.3 V</text>
  <line x1="265" y1="1070" x2="305" y2="1070" class="wgnd"/>
  <text x="313" y="1074" font-size="12" fill="#3d4450">GND</text>
  <line x1="375" y1="1070" x2="415" y2="1070" class="wsig"/>
  <text x="423" y="1074" font-size="12" fill="#3d4450">Signal (3.3 V logic)</text>
  <line x1="570" y1="1070" x2="610" y2="1070" class="wled"/>
  <text x="618" y="1074" font-size="12" fill="#3d4450">LED signal</text>
  <line x1="720" y1="1070" x2="760" y2="1070" class="wmot"/>
  <text x="768" y="1074" font-size="12" fill="#3d4450">Motor output</text>
  <circle cx="880" cy="1070" r="5" fill="#2f3640"/>
  <text x="892" y="1074" font-size="12" fill="#3d4450">junction (wires joined)</text>
  <text x="40" y="1094" font-size="12" fill="#8a929e">Lines that cross without a dot are NOT connected.</text>
</svg>
